<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="theme-color" content="#1d4ba0">
    <title>Falabrinca · 葡语口语陪练</title>
    <style>
        :root{--blue:#1d4ba0;--blue2:#e8eefb;--green:#9be58a;--bg:#f3f4f6;--tx:#111827;--sub:#6b7280;--red:#e5484d}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
        html,body{height:100%;margin:0;font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;color:var(--tx);background:var(--bg)}
        #app{display:flex;flex-direction:column;height:100%;height:100dvh}
        header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--blue);color:#fff}
        header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.3px}
        #st{font-size:12px;min-width:74px;display:flex;align-items:center;gap:5px}
        #st i{width:8px;height:8px;border-radius:50%;background:#9ca3af}
        #st.on i{background:#4ade80}#st.off i{background:#f87171}
        #mode{min-width:74px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:3px 8px;font-size:12px}
        #mode.zh{background:#fff;color:var(--blue);font-weight:600}
        #banner{background:#fff4d6;color:#7a5b00;font-size:13px;padding:6px 14px;text-align:center}
        #chat{flex:1;overflow-y:auto;padding:6px 12px 14px;scrollbar-width:none;overscroll-behavior:contain}
        #chat::-webkit-scrollbar{display:none}
        .tip{text-align:center;color:var(--sub);font-size:13px;margin:16px 24px}
        .row{display:flex;margin:12px 0}.row.me{justify-content:flex-end}
        .col{max-width:82%;display:flex;flex-direction:column;gap:6px}
        .bub{padding:9px 13px;border-radius:14px;word-break:break-word;user-select:text;-webkit-user-select:text}
        .me .bub{background:var(--green);border-top-right-radius:4px}
        .me small{display:block;color:#3b6b32;font-size:12px;margin-top:2px}
        .ai .bub{background:#fff;border-top-left-radius:4px}
        .pill{display:flex;align-items:center;gap:8px;min-width:96px;cursor:pointer;color:var(--blue);font-weight:500}
        .pill .ic{font-size:18px}.pill.play .ic{animation:pulse .8s infinite}
        @keyframes pulse{50%{opacity:.35}}
        .ex{background:#fff;border-left:3px solid var(--blue);border-radius:4px 12px 12px 4px;padding:8px 12px;font-size:15px;user-select:text;-webkit-user-select:text}
        .ex b{display:block;font-size:12px;color:var(--blue);margin-bottom:2px}
        .ex .body{white-space:pre-wrap}
        .dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#9ca3af;animation:pulse 1s infinite}
        .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
        footer{display:flex;align-items:center;gap:10px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:#fafafa;border-top:1px solid #e5e7eb}
        .kb{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid #d1d5db;background:#fff;font-size:20px}
        #hold{flex:1;height:56px;border:0;border-radius:28px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;touch-action:none;box-shadow:0 4px 14px rgba(29,75,160,.35);transition:transform .12s,background .12s}
        #hold.rec{transform:scale(1.05);background:#153a80}#hold.cancel{background:var(--red)}
        #txt{flex:1;height:44px;border:1.5px solid #d1d5db;border-radius:22px;padding:0 16px;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}
        #txt:focus{border-color:var(--blue)}
        #send{flex:none;height:44px;padding:0 18px;border:0;border-radius:22px;background:var(--blue);color:#fff;font-size:15px;font-weight:600}
        #send:disabled{opacity:.4}
        [hidden]{display:none!important}
        #rec{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);width:170px;padding:18px 0 14px;border-radius:18px;background:rgba(17,24,39,.88);color:#fff;text-align:center;font-size:14px}
        #rec.cancel{background:rgba(229,72,77,.92)}
        .wave{display:flex;justify-content:center;align-items:center;gap:5px;height:40px;margin-bottom:8px}
        .wave i{width:5px;height:12px;border-radius:3px;background:#7fd0ff;animation:w .9s ease-in-out infinite}
        .wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
        @keyframes w{50%{height:36px}}
        #mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
        #sheet{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px);animation:up .2s ease-out}
        @keyframes up{from{transform:translateY(100%)}}
        #sheet button{display:block;width:100%;height:52px;border:0;background:none;font-size:17px;text-align:left;padding:0 12px;border-bottom:1px solid #f0f0f0}
        #sheet button.c{color:var(--sub);text-align:center;border:0;margin-top:6px;background:var(--bg);border-radius:12px}
        #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(17,24,39,.9);color:#fff;padding:8px 16px;border-radius:18px;font-size:14px;max-width:80%;text-align:center}
    </style>
</head>
<body>
<div id="app">
    <header>
        <div id="st"><i></i><span>连接中</span></div>
        <h1>Falabrinca</h1>
        <button id="mode">🇵🇹 葡语</button>
    </header>
    <div id="banner" hidden>中文求助模式：说中文，我会先翻译成葡语，再由教练回复</div>
    <div id="chat"><div class="tip">按住下方按钮，用葡语和 Tuga 老师聊天。<br>不会说？右上角切换到中文求助。<br>长按老师的语音条：原文 / 翻译 / 语法解析。</div></div>
    <footer>
        <button class="kb" id="kb" aria-label="切换输入方式">⌨️</button>
        <button id="hold">按住 说话</button>
        <input id="txt" placeholder="输入葡语…" enterkeyhint="send" autocomplete="off" hidden>
        <button id="send" disabled hidden>发送</button>
    </footer>
</div>
<div id="rec" hidden><div class="wave"><i></i><i></i><i></i><i></i><i></i></div><span>正在录音… 上滑取消</span></div>
<div id="mask" hidden><div id="sheet">
    <button data-k="pt">📝 显示原文</button>
    <button data-k="zh">🌐 翻译中文</button>
    <button data-k="ex">🧠 语法解析</button>
    <button class="c" data-k="x">取消</button>
</div></div>
<audio id="player" playsinline></audio>

<script>
    const API = '';               // 与 nginx 同域反代 /api 时留空；否则填 'https://your.domain'
    const $ = s => document.querySelector(s);
    const chat = $('#chat'), player = $('#player'), holdBtn = $('#hold');
    const sid = localStorage.sid || (localStorage.sid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    let mode = 'pt', textMode = false, cur = null, playingPill = null, holding = false;

    const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
    const scroll = () => requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
    function toast(m) { $('#toast')?.remove(); const t = el('div', '', m); t.id = 'toast'; document.body.append(t); setTimeout(() => t.remove(), 2200); }

    /* ---------- 网络 ---------- */
    async function post(path, fd) {
        const r = await fetch(API + path, { method: 'POST', body: fd });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.detail || j.message || ('请求失败 ' + r.status));
        return j.data || j;                       // 兼容 {status,data:{}} 与扁平返回
    }
    async function ping() {
        const s = $('#st');
        try { const r = await fetch(API + '/api/health', { cache: 'no-store' }); if (!r.ok) throw 0; s.className = 'on'; s.lastChild.textContent = '已连接'; }
        catch { s.className = 'off'; s.lastChild.textContent = '未连接'; }
    }
    ping(); setInterval(ping, 15000);

    /* ---------- 音频 ---------- */
    const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
    function unlock() { player.src = SILENT; player.play().catch(() => {}); }  // 在用户手势内解锁 iOS 自动播放
    function audioUrl(d) {
        if (d.audio_url) return d.audio_url;
        if (d.audio_base64) {
            const b = atob(d.audio_base64), u = new Uint8Array(b.length);
            for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
            return URL.createObjectURL(new Blob([u], { type: 'audio/' + (d.audio_format || 'wav') }));
        }
    }
    function play(url, pill) {
        if (playingPill) playingPill.classList.remove('play');
        if (playingPill === pill && !player.paused) { player.pause(); playingPill = null; return; }
        playingPill = pill; player.src = url; player.play().then(() => pill.classList.add('play')).catch(() => toast('点击语音条播放'));
    }
    player.onended = player.onpause = () => playingPill?.classList.remove('play');

    /* ---------- 消息渲染 ---------- */
    function addMe(text) {
        const row = el('div', 'row me'), b = el('div', 'bub', text);
        row.append(el('div', 'col')); row.firstChild.append(b); chat.append(row); scroll(); return b;
    }
    function fillMe(b, d) {
        const pt = d.user_pt || d.user_text || '（未识别）';
        b.textContent = pt;
        if (d.user_pt && d.user_text && d.user_text !== d.user_pt) b.append(el('small', '', '原话：' + d.user_text));
    }
    function addTyping() { const r = el('div', 'row ai'), b = el('div', 'bub dots'); b.innerHTML = '<span></span><span></span><span></span>'; r.append(el('div', 'col')); r.firstChild.append(b); chat.append(r); scroll(); return r; }

    function addAI(d) {
        const url = audioUrl(d), m = { id: d.message_id, text: d.ai_text, ex: {} };
        const row = el('div', 'row ai'), col = el('div', 'col'), bub = el('div', 'bub pill');
        const dur = el('span', '', '··');
        bub.append(el('span', 'ic', '🔊'), dur); col.append(bub); row.append(col); chat.append(row); m.box = col;
        if (url) {
            const a = new Audio(url);
            a.onloadedmetadata = () => { const s = Math.max(1, Math.round(a.duration)); dur.textContent = s + '″'; bub.style.width = Math.min(96 + s * 9, 250) + 'px'; };
            press(bub, () => { cur = m; $('#mask').hidden = false; }, () => play(url, bub));
            play(url, bub);
        } else { dur.textContent = '无语音'; press(bub, () => { cur = m; $('#mask').hidden = false; }); }
        scroll();
    }
    function press(node, onLong, onTap) {         // 长按 500ms 触发菜单；短按触发 onTap
        let t, x, y;
        node.addEventListener('pointerdown', e => { x = e.clientX; y = e.clientY; t = setTimeout(() => { t = null; navigator.vibrate?.(15); onLong(); }, 500); });
        node.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - x, e.clientY - y) > 10) { clearTimeout(t); t = null; } });
        node.addEventListener('pointerup', () => { if (t) { clearTimeout(t); t = null; onTap && onTap(); } });
        node.addEventListener('pointercancel', () => { clearTimeout(t); t = null; });
        node.addEventListener('contextmenu', e => e.preventDefault());
    }

    /* ---------- 长按菜单：原文 / 翻译 / 解析 ---------- */
    function ex(m, k, title) {                    // 已存在则切换显示/隐藏，返回 null
        let b = m.ex[k];
        if (b) { b.hidden = !b.hidden; return null; }
        b = m.ex[k] = el('div', 'ex'); b.append(el('b', '', title), el('div', 'body')); m.box.append(b); scroll(); return b;
    }
    $('#sheet').onclick = async e => {
        const k = e.target.dataset.k; if (!k) return;
        $('#mask').hidden = true; const m = cur; if (k === 'x' || !m) return;
        if (k === 'pt') { const b = ex(m, 'pt', '📝 原文'); if (b) b.lastChild.textContent = m.text; return; }
        const zh = k === 'zh', b = ex(m, k, zh ? '🌐 中文翻译' : '🧠 语法解析'); if (!b) return;
        b.lastChild.textContent = zh ? '翻译中…' : 'AI 正在解析…';
        const fd = new FormData(); fd.append('session_id', sid); fd.append('text', m.text); if (m.id) fd.append('message_id', m.id);
        try {
            const d = await post(zh ? '/api/translate' : '/api/explain', fd);
            b.lastChild.textContent = (zh ? d.translation : d.explanation) || '（无内容）';
        } catch (err) { b.remove(); delete m.ex[k]; toast(err.message); }
        scroll();
    };
    $('#mask').onclick = e => { if (e.target.id === 'mask') e.target.hidden = true; };

    /* ---------- 发送 ---------- */
    async function send({ blob, ext, text }) {
        const fd = new FormData(); fd.append('session_id', sid); fd.append('mode', mode);
        let mine;
        if (blob) { fd.append('audio', blob, 'rec.' + ext); mine = addMe('🎤 识别中…'); }
        else { fd.append('text', text); mine = addMe(text); }
        const typing = addTyping();
        try {
            const d = await post(blob ? '/api/chat/audio' : '/api/chat/text', fd);
            typing.remove(); fillMe(mine, d); addAI(d);
        } catch (err) { typing.remove(); mine.parentNode.parentNode.remove(); toast(err.message); }
    }

    /* ---------- 按住说话 ---------- */
    const MIME = window.MediaRecorder && ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t));
    let mr, chunks, t0, startY, cancel, stream;
    holdBtn.addEventListener('pointerdown', async e => {
        e.preventDefault(); holding = true; startY = e.clientY; cancel = false; unlock();
        holdBtn.setPointerCapture(e.pointerId);
        if (!MIME) { toast('浏览器不支持录音（需 HTTPS）'); holding = false; return; }
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch { toast('无法使用麦克风：请用 HTTPS 访问并允许权限'); holding = false; return; }
        if (!holding) { stream.getTracks().forEach(t => t.stop()); return; }   // 权限弹窗期间已松手
        chunks = []; mr = new MediaRecorder(stream, { mimeType: MIME });
        mr.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
        mr.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            if (cancel) return;
            if (Date.now() - t0 < 600) return toast('说话时间太短');
            send({ blob: new Blob(chunks, { type: MIME }), ext: MIME.includes('mp4') ? 'm4a' : 'webm' });
        };
        mr.start(); t0 = Date.now(); navigator.vibrate?.(10);
        holdBtn.classList.add('rec'); holdBtn.textContent = '松开 发送'; $('#rec').hidden = false;
    });
    holdBtn.addEventListener('pointermove', e => {
        if (!holding) return;
        cancel = e.clientY < startY - 80;
        holdBtn.classList.toggle('cancel', cancel); $('#rec').classList.toggle('cancel', cancel);
        $('#rec span').textContent = cancel ? '松开手指，取消发送' : '正在录音… 上滑取消';
        holdBtn.textContent = cancel ? '松开 取消' : '松开 发送';
    });
    const endRec = () => {
        holding = false; holdBtn.className = ''; holdBtn.textContent = '按住 说话'; $('#rec').hidden = true; $('#rec').classList.remove('cancel');
        if (mr && mr.state === 'recording') mr.stop();
    };
    holdBtn.addEventListener('pointerup', endRec);
    holdBtn.addEventListener('pointercancel', () => { cancel = true; endRec(); });
    holdBtn.addEventListener('contextmenu', e => e.preventDefault());

    /* ---------- 文字模式 / 语言模式 ---------- */
    const txt = $('#txt'), sendBtn = $('#send');
    $('#kb').onclick = () => {
        textMode = !textMode;
        holdBtn.hidden = textMode; txt.hidden = sendBtn.hidden = !textMode;
        $('#kb').textContent = textMode ? '🎤' : '⌨️';
        if (textMode) txt.focus();
    };
    txt.oninput = () => sendBtn.disabled = !txt.value.trim();
    const submit = () => { const v = txt.value.trim(); if (!v) return; txt.value = ''; sendBtn.disabled = true; unlock(); send({ text: v }); };
    sendBtn.onclick = submit;
    txt.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) submit(); };
    $('#mode').onclick = e => {
        mode = mode === 'pt' ? 'zh' : 'pt';
        e.target.className = mode === 'zh' ? 'zh' : ''; e.target.textContent = mode === 'zh' ? '🇨🇳 中文求助' : '🇵🇹 葡语';
        $('#banner').hidden = mode === 'pt'; txt.placeholder = mode === 'zh' ? '输入中文，我来翻译成葡语…' : '输入葡语…';
        toast(mode === 'zh' ? '已切换：中文将先翻译成葡语' : '已切换：葡语模式');
    };
</script>
</body>
</html>
