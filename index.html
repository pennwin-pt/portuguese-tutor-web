<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="theme-color" content="#3d9be9">
    <title>葡语陪练</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/touch-protection.css">
</head>
<body>
<div id="app">
    <header>
        <div id="st"><i></i><span>连接中</span></div>
        <h1>葡语陪练</h1>
        <button id="mode">🇵🇹 葡语</button>
    </header>
    <div id="banner" hidden>中文求助模式：说中文，我会先翻译成葡语，再由教练回复</div>
    <div id="chat"><div class="tip">按住下方按钮，用葡语和 Tuga 老师聊天。<br>不会说？右上角切换到中文求助。<br>长按老师的语音条：原文 / 翻译 / 语法解析。</div></div>
    <footer>
        <button class="kb" id="kb" aria-label="切换输入方式">⌨️</button>
        <button id="hold">按住 说话</button>
        <input id="txt" placeholder="输入葡语…" enterkeyhint="send" autocomplete="off" hidden>
        <button id="send" disabled hidden>发送</button>
    </footer>
</div>
<div id="rec" hidden><div class="wave"><i></i><i></i><i></i><i></i><i></i></div><span>正在录音… 上滑取消</span></div>
<div id="mask" hidden><div id="sheet">
    <button data-k="pt">📝 显示原文</button>
    <button data-k="zh">🌐 翻译中文</button>
    <button data-k="ex">🧠 语法解析</button>
    <button class="c" data-k="x">取消</button>
</div></div>
<audio id="player" playsinline></audio>

<script src="js/index.js"></script>
</body>
</html>
