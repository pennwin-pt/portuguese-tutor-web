<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="apple-touch-icon" href="images/logo.png">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#3d9be9">
  <title>单词任务</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/touch-protection.css">
  <link rel="stylesheet" href="css/words.css">
  <link rel="stylesheet" href="css/scene.css">
</head>
<body>
<div id="app">
  <header>
    <div class="hl"><button class="ib" id="back" aria-label="返回聊天">‹</button></div>
    <div id="ttl"><h1>单词任务</h1></div>
    <div class="hr"><span id="prog"></span></div>
  </header>
  <div id="bar"><i></i></div>
  <div id="points" aria-live="polite">累计积分：… · 余额：… · 本轮得分：0</div>
  <main id="stage"></main>
  <footer>
    <button id="reveal" hidden>💡 公布答案</button>
    <button id="hold" hidden>按住 说话</button>
    <button id="act2" hidden>返回聊天</button>
    <button id="skip" hidden>跳过</button>
    <button id="act">领取今日任务</button>
  </footer>
</div>
<div id="rec" hidden><div class="wave"><i></i><i></i><i></i><i></i><i></i></div><span>正在录音… 上滑取消</span></div>

<dialog id="source-dialog" aria-labelledby="source-title">
  <div class="source-dialog-head">
    <h2 id="source-title">单词来源</h2>
    <button id="source-close" class="ib" type="button" aria-label="关闭">×</button>
  </div>
  <img id="source-image" alt="单词关联图片" hidden>
  <pre id="source-remark" hidden></pre>
  <p id="source-empty" hidden></p>
</dialog>

<audio id="player" playsinline></audio>

<script src="js/scene.js"></script>
<script src="js/words.js"></script>
</body>
</html>
